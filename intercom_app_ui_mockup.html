
<style>
  body { margin: 0; font-family: var(--font-sans); background: transparent; }
  .phones { display: flex; gap: 24px; justify-content: center; flex-wrap: wrap; padding: 1rem 0 1.5rem; }
  .phone { width: 200px; background: #0d0f14; border-radius: 28px; border: 1px solid rgba(255,255,255,0.12); overflow: hidden; box-shadow: 0 0 0 6px rgba(255,255,255,0.04); }
  .phone-inner { padding: 20px 16px 28px; min-height: 360px; display: flex; flex-direction: column; align-items: center; position: relative; }
  .status-bar { display: flex; justify-content: space-between; align-items: center; width: 100%; margin-bottom: 16px; }
  .status-bar span { font-size: 10px; color: rgba(255,255,255,0.4); }
  .notch { width: 50px; height: 6px; background: #0d0f14; border-radius: 3px; position: absolute; top: 0; left: 50%; transform: translateX(-50%); z-index: 2; }

  /* Screen 1: Role Select */
  .screen-label { font-size: 9px; letter-spacing: 0.08em; color: rgba(255,255,255,0.3); text-transform: uppercase; margin-bottom: 8px; width: 100%; text-align: center; }
  .logo-dot { width: 36px; height: 36px; border-radius: 50%; border: 1.5px solid rgba(255,120,30,0.6); display: flex; align-items: center; justify-content: center; margin-bottom: 4px; }
  .logo-dot svg { width: 18px; height: 18px; }
  .app-title { font-size: 13px; font-weight: 500; color: #fff; margin-bottom: 2px; }
  .app-sub { font-size: 9px; color: rgba(255,255,255,0.35); margin-bottom: 20px; }
  .role-card { width: 100%; border-radius: 12px; padding: 12px 10px; margin-bottom: 8px; display: flex; align-items: center; gap: 10px; border: 1px solid; cursor: pointer; }
  .role-card.director { background: rgba(255,120,30,0.1); border-color: rgba(255,120,30,0.4); }
  .role-card.crew { background: rgba(60,150,255,0.08); border-color: rgba(60,150,255,0.25); }
  .role-icon { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
  .role-icon.d { background: rgba(255,120,30,0.2); }
  .role-icon.c { background: rgba(60,150,255,0.15); }
  .role-name { font-size: 11px; font-weight: 500; color: #fff; }
  .role-desc { font-size: 8px; color: rgba(255,255,255,0.4); }

  /* Screen 2: Room Join */
  .back-row { display: flex; align-items: center; gap: 6px; width: 100%; margin-bottom: 12px; }
  .back-row span { font-size: 9px; color: rgba(255,120,30,0.8); }
  .director-badge { background: rgba(255,120,30,0.15); border: 1px solid rgba(255,120,30,0.35); border-radius: 6px; padding: 3px 8px; font-size: 9px; color: rgba(255,120,30,0.9); margin-bottom: 14px; }
  .room-label { font-size: 9px; color: rgba(255,255,255,0.35); width: 100%; margin-bottom: 4px; }
  .room-input { width: 100%; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); border-radius: 8px; padding: 8px 10px; font-size: 10px; color: #fff; box-sizing: border-box; margin-bottom: 10px; }
  .recent-label { font-size: 8px; color: rgba(255,255,255,0.25); width: 100%; margin-bottom: 6px; }
  .recent-chip { display: inline-flex; align-items: center; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 3px 8px; font-size: 8px; color: rgba(255,255,255,0.5); margin-right: 4px; margin-bottom: 4px; }
  .join-btn { width: 100%; background: linear-gradient(135deg, #ff7a1e, #e85d04); border: none; border-radius: 10px; padding: 9px; font-size: 10px; font-weight: 500; color: #fff; margin-top: 8px; cursor: pointer; }

  /* Screen 3: Intercom Active */
  .room-chip { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 3px 10px; font-size: 8px; color: rgba(255,255,255,0.45); margin-bottom: 4px; }
  .members-row { display: flex; gap: 6px; margin-bottom: 16px; }
  .avatar { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.15); display: flex; align-items: center; justify-content: center; font-size: 8px; color: rgba(255,255,255,0.6); background: rgba(255,255,255,0.07); }
  .avatar.active { border-color: #ff7a1e; background: rgba(255,120,30,0.15); color: rgba(255,120,30,0.9); }
  .speaking-indicator { display: flex; align-items: center; gap: 5px; margin-bottom: 6px; }
  .wave-dots { display: flex; gap: 2px; align-items: flex-end; height: 14px; }
  .wave-dot { width: 2.5px; border-radius: 2px; background: #ff7a1e; }
  .ptt-wrap { display: flex; flex-direction: column; align-items: center; gap: 6px; margin-top: 4px; }
  .ptt-outer { width: 72px; height: 72px; border-radius: 50%; border: 2px solid rgba(255,120,30,0.3); display: flex; align-items: center; justify-content: center; }
  .ptt-btn { width: 58px; height: 58px; border-radius: 50%; background: linear-gradient(145deg, #ff7a1e, #c94f00); display: flex; align-items: center; justify-content: center; }
  .ptt-hint { font-size: 8px; color: rgba(255,255,255,0.3); }
  .status-pill { border-radius: 20px; padding: 3px 10px; font-size: 8px; font-weight: 500; }
  .status-pill.listening { background: rgba(60,150,255,0.1); color: rgba(60,150,255,0.7); border: 1px solid rgba(60,150,255,0.25); }
  .status-pill.speaking { background: rgba(255,120,30,0.15); color: rgba(255,120,30,0.9); border: 1px solid rgba(255,120,30,0.4); }
</style>

      <div class="back-row">
